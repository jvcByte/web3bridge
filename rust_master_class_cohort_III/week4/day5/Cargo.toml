[package]
name = "day5-blog-api"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# `oneshot` lets the integration tests drive the Router directly, with no
# TcpListener and no port. Tests run in parallel and never collide.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
